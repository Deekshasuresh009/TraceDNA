version: '3.9'

services:
  db:
    image: ankane/pgvector:latest
    container_name: tracedna-db
    environment:
      POSTGRES_DB: tracedna
      POSTGRES_USER: tracedna_user
      POSTGRES_PASSWORD: tracedna_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracedna_user -d tracedna"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tracedna-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    container_name: tracedna-web
    command: >
      sh -c "python manage.py migrate &&
             gunicorn tracedna.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - ./secrets/gcp-sa.json:/app/secrets/gcp-sa.json:ro
    environment:
      - DJANGO_SETTINGS_MODULE=tracedna.settings
      - DATABASE_URL=postgresql://tracedna_user:tracedna_pass@db:5432/tracedna
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - GCS_VAULT_BUCKET=tracedna-vault
      - GCS_TEMP_BUCKET=tracedna-temp-suspects
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/gcp-sa.json
      - DJANGO_SECRET_KEY=change-me-in-production-use-a-real-secret
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=*
      - GCP_PROJECT_ID=tracedna
      - GCP_LOCATION=us-central1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: tracedna-celery
    command: celery -A tracedna worker -l info --concurrency=4
    volumes:
      - .:/app
      - ./secrets/gcp-sa.json:/app/secrets/gcp-sa.json:ro
    environment:
      - DJANGO_SETTINGS_MODULE=tracedna.settings
      - DATABASE_URL=postgresql://tracedna_user:tracedna_pass@db:5432/tracedna
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - GCS_VAULT_BUCKET=tracedna-vault
      - GCS_TEMP_BUCKET=tracedna-temp-suspects
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/gcp-sa.json
      - GCP_PROJECT_ID=tracedna
      - GCP_LOCATION=us-central1
      - GEMINI_API_KEY=${GEMINI_API_KEY}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: tracedna-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  static_volume:
